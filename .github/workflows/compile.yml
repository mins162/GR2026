# GPU 없이 "컴파일이 깨지지 않는지"만 확인하는 CI.
# GitHub 러너에는 NVIDIA GPU가 없으므로 실행/벤치마크는 하지 않는다.
# nvcc는 -arch로 타겟을 명시하면 GPU를 조회하지 않고 코드 생성만 하므로 컴파일은 가능하다.
name: compile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 같은 브랜치에 연달아 push하면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    name: nvcc (${{ matrix.target }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: opt        # 최적화 버전
            srcdir: src
          - target: baseline   # 논문 baseline
            srcdir: baseline/src

    steps:
      - uses: actions/checkout@v4

      # devel 컨테이너 이미지(3GB)를 통째로 받으면 pull에만 ~75s가 든다.
      # 컴파일에 실제로 필요한 건 nvcc / cudart 헤더 / thrust(cccl) 뿐이므로
      # 해당 패키지만 apt로 설치한다.
      - name: CUDA 12.5 (nvcc만) 설치
        run: |
          wget -qO /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          # 전체 sources.list를 갱신하지 않고 방금 추가된 CUDA 저장소만 본다.
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/cuda-ubuntu2404-x86_64.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-5 cuda-cudart-dev-12-5 cuda-cccl-12-5
          echo "/usr/local/cuda-12.5/bin" >> "$GITHUB_PATH"

      - name: nvcc 버전 확인
        run: nvcc --version

      # 아키텍처별로 잡을 나누면 설치 단계가 그만큼 반복된다.
      # 한 번의 호출에 -gencode를 겹쳐 프론트엔드 파싱은 1회만 하고,
      # -t 0으로 아키텍처별 ptxas를 병렬 실행한다.
      - name: 컴파일 (sm_75, sm_86)
        working-directory: ${{ matrix.srcdir }}
        run: |
          nvcc main.cpp -o /tmp/InstantGR-${{ matrix.target }} \
            -std=c++17 -x cu -O3 -t 0 \
            -gencode arch=compute_75,code=sm_75 \
            -gencode arch=compute_86,code=sm_86

  evaluator:
    name: g++ (evaluator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 컴파일
        working-directory: run
        run: g++ -O3 -std=c++17 -o /tmp/evaluator evaluator.cpp
